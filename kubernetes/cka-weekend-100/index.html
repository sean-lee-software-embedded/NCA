<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CKA v1.35 中文 100 頁週末衝刺教材，100 hands-on lessons aligned to the current official CKA domains."><title>CKA v1.35｜100頁週末衝刺</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#07111f;color:#eaf2ff;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:680px;padding:32px}.err{color:#ff8aa1}</style></head><body><main><h1>CKA v1.35 · 100頁週末衝刺</h1><p id="status">正在載入完整教材…</p><noscript>此頁需要 JavaScript 才能載入完整 100 頁教材。</noscript></main><script>(async()=>{try{const files=['parts/00.txt','parts/01.txt','parts/02.txt','parts/03.txt','parts/04.txt','parts/05.txt','parts/06.txt','parts/07a.txt','parts/07b.txt','parts/08.txt','parts/09.txt'];const chunks=await Promise.all(files.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.text()}));const b64=chunks.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();document.open();document.write(text);document.close();}catch(e){const s=document.getElementById('status');s.className='err';s.textContent='載入失敗：'+e+'. 請重新整理或使用最新版 Chrome / Edge / Safari / Firefox。';}})();</script></body></html>
